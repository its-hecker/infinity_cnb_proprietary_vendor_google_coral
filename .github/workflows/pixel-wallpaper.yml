name: Check bundled Google Pokemon wallpaper

on:
  workflow_dispatch:
  push:
    branches: [features-experimental]
    paths:
      - '.github/workflows/pixel-wallpaper.yml'
      - 'tools/check_pixel_wallpaper.py'
      - 'tools/enable_google_pokemon_wallpaper.py'
      - 'tools/test_google_pokemon_registration.py'
      - 'tools/Android.bp'
      - 'tools/PIXEL_WALLPAPER.md'
      - 'tools/apk_resource_reader.py'
      - 'proprietary/product/priv-app/PixelLiveWallpaper/**'
      - 'Android.bp'
      - 'coral-vendor.mk'
  pull_request:
    branches: [features-experimental]
    paths:
      - '.github/workflows/pixel-wallpaper.yml'
      - 'tools/check_pixel_wallpaper.py'
      - 'tools/enable_google_pokemon_wallpaper.py'
      - 'tools/test_google_pokemon_registration.py'
      - 'tools/Android.bp'
      - 'tools/PIXEL_WALLPAPER.md'
      - 'tools/apk_resource_reader.py'
      - 'proprietary/product/priv-app/PixelLiveWallpaper/**'
      - 'Android.bp'
      - 'coral-vendor.mk'

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/features-experimental' || github.base_ref == 'features-experimental'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tools
            proprietary/product/priv-app/PixelLiveWallpaper
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original APK and absence of custom Sidekick content
        run: python3 tools/check_pixel_wallpaper.py
      - name: Check Pokemon identifier, fused-module and Oslo permission regressions
        run: python3 -m unittest discover -s tools -p test_google_pokemon_registration.py
      - name: Enable bundled Google Pokemon and verify unchanged payload
        run: |
          python3 tools/enable_google_pokemon_wallpaper.py \
            --input proprietary/product/priv-app/PixelLiveWallpaper/PixelLiveWallpaper.apk \
            --output "$RUNNER_TEMP/PixelLiveWallpaper.apk"
          python3 tools/check_pixel_wallpaper.py \
            --enabled "$RUNNER_TEMP/PixelLiveWallpaper.apk"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Parse generated manifest with Android AAPT2
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree \
            "$RUNNER_TEMP/PixelLiveWallpaper.apk" --file AndroidManifest.xml \
            > "$RUNNER_TEMP/PixelLiveWallpaper.xmltree"
