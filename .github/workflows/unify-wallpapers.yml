name: Build unified Pokemon + Sidekick wallpaper

on:
  workflow_dispatch:
    inputs:
      rebuild_payload:
        description: Rebuild Sidekick code and animations instead of updating picker metadata only
        type: boolean
        default: false
  push:
    branches: [faceid, features-experimental]
    paths:
      - ".github/workflows/unify-wallpapers.yml"
      - "tools/unify_pixel_live_wallpaper.py"
      - "tools/apk_resource_reader.py"
      - "tools/check_sidekick_picker.py"
      - "tools/test_sidekick_picker.py"
      - "tools/sidekick_dex.py"
      - "tools/test_sidekick_dex.py"

concurrency:
  group: unified-wallpapers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_APK: proprietary/product/priv-app/PixelLiveWallpaper/PixelLiveWallpaper.apk
      REBUILD_PAYLOAD: ${{ github.event_name != 'workflow_dispatch' || inputs.rebuild_payload }}

    steps:
      - name: Checkout vendor branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout matching device branch
        uses: actions/checkout@v4
        with:
          repository: its-hecker/infinity_cnb_android_device_google_coral
          ref: ${{ github.ref_name }}
          path: device
          fetch-depth: 1

      - name: Test picker registration and DEX replacement
        run: python3 -m unittest discover -s tools -p "test_sidekick*.py" -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        if: env.REBUILD_PAYLOAD == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare enhanced Sidekick assets
        if: env.REBUILD_PAYLOAD == 'true'
        run: |
          set -euxo pipefail
          mkdir -p work/assets/sidekick
          python3 device/MotionSenseWallpapers/tools/build_extended_packs.py \
            --source-raw device/MotionSenseWallpapers/res/raw \
            --out work/assets/sidekick
          test "$(find work/assets/sidekick -name 'wallpaper_*.json' | wc -l)" -ge 16
          python3 -m json.tool work/assets/sidekick/wallpaper_doraemon.json >/dev/null
          python3 -m json.tool work/assets/sidekick/wallpaper_batman.json >/dev/null
          python3 -m json.tool work/assets/sidekick/wallpaper_nova.json >/dev/null
          python3 -m json.tool work/assets/sidekick/wallpaper_kumo.json >/dev/null
          python3 -m json.tool work/assets/sidekick/wallpaper_ember.json >/dev/null
          python3 -m json.tool work/assets/sidekick/wallpaper_byte.json >/dev/null

      - name: Build resource-independent Sidekick payload
        if: env.REBUILD_PAYLOAD == 'true'
        run: |
          set -euxo pipefail
          mkdir -p work/payload/src/main/java/com/hecker/motionsense/wallpapers
          mkdir -p work/payload/src/main/assets/sidekick
          cp device/MotionSenseWallpapers/unified_payload/*.java \
            work/payload/src/main/java/com/hecker/motionsense/wallpapers/
          cp device/MotionSenseWallpapers/src/com/hecker/motionsense/wallpapers/OsloGestureClient.java \
            work/payload/src/main/java/com/hecker/motionsense/wallpapers/
          cp work/assets/sidekick/*.json work/payload/src/main/assets/sidekick/
          mkdir -p work/payload/src/test/java/com/hecker/motionsense/wallpapers
          cp device/MotionSenseWallpapers/unified_payload/tests/*.java \
            work/payload/src/test/java/com/hecker/motionsense/wallpapers/

          cat > work/payload/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SidekickPayload"
          EOF

          cat > work/payload/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > work/payload/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3'
          }

          android {
              namespace 'com.hecker.motionsense.wallpapers'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.hecker.sidekick.payload'
                  minSdk 29
                  targetSdk 35
                  versionCode 1
                  versionName '1'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              testOptions {
                  unitTests.includeAndroidResources = true
                  unitTests.all {
                      maxHeapSize = "2g"
                      systemProperty "sidekick.render.output", file("../render").absolutePath
                      testLogging { events "passed", "skipped", "failed"; exceptionFormat "full" }
                  }
              }
          }

          dependencies {
              implementation 'com.airbnb.android:lottie:6.6.2'
              testImplementation 'junit:junit:4.13.2'
              testImplementation 'org.robolectric:robolectric:4.14.1'
          }
          EOF

          cat > work/payload/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:hasCode="true" />
          </manifest>
          EOF

          (
            cd work/payload
            gradle --no-daemon :testDebugUnitTest :assembleRelease
            PAYLOAD_APK="$(find build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
            test -n "$PAYLOAD_APK"
            cp "$PAYLOAD_APK" ../payload-release.apk
          )
          test -s work/payload-release.apk

      - name: Download apktool
        run: |
          set -euxo pipefail
          mkdir -p work/tools
          curl -fL --retry 3 \
            -o work/tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          java -jar work/tools/apktool.jar --version

      - name: Isolate Sidekick AndroidX dependencies
        if: env.REBUILD_PAYLOAD == 'true'
        run: |
          set -euxo pipefail
          java -jar work/tools/apktool.jar d -f -r \
            work/payload-release.apk -o work/payload-decoded
          python3 tools/sidekick_dex.py relocate --decoded work/payload-decoded
          java -jar work/tools/apktool.jar b work/payload-decoded \
            -o work/payload-isolated.apk
          python3 tools/sidekick_dex.py validate work/payload-isolated.apk

      - name: Register Sidekick in the Pixel picker catalog
        run: |
          set -euo pipefail
          test -s "$BASE_APK"
          java -jar work/tools/apktool.jar d -f -s "$BASE_APK" -o work/decoded
          if [ "$REBUILD_PAYLOAD" = true ]; then
            python3 tools/unify_pixel_live_wallpaper.py \
              --decoded work/decoded \
              --thumbnail-dir work/render/thumbnails \
              --assets work/assets/sidekick
          else
            python3 tools/unify_pixel_live_wallpaper.py \
              --decoded work/decoded \
              --thumbnail-dir work/decoded/res/drawable-nodpi \
              --registration-only
          fi
          java -jar work/tools/apktool.jar b work/decoded -o work/staged.apk

      - name: Replace payload DEX when requested
        if: env.REBUILD_PAYLOAD == 'true'
        run: |
          set -euo pipefail
          python3 tools/sidekick_dex.py inject \
            --staged work/staged.apk \
            --payload work/payload-isolated.apk

      - name: Align and sign validation APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 work/staged.apk work/unified-unsigned.apk
          keytool -genkeypair \
            -keystore work/validation.jks \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Sidekick Validation,O=Hecker,C=PK" >/dev/null 2>&1
          "$BT/apksigner" sign \
            --ks work/validation.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out work/UnifiedPixelLiveWallpaper.apk \
            work/unified-unsigned.apk
          "$BT/apksigner" verify --verbose work/UnifiedPixelLiveWallpaper.apk

      - name: Record playback and Binder regression results
        if: env.REBUILD_PAYLOAD == 'true'
        run: |
          python3 - <<'PY' > work/sidekick-runtime-validation.txt
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {'OsloGestureClientTest': 5, 'SidekickPlaybackTest': 3, 'SidekickRenderTest': 4}
          observed = {}
          for path in sorted(Path('work/payload/build/test-results/testDebugUnitTest').glob('TEST-*.xml')):
              suite = ET.parse(path).getroot()
              name = suite.get('name').rsplit('.', 1)[-1]
              assert int(suite.get('failures', 0)) == 0, name
              assert int(suite.get('errors', 0)) == 0, name
              assert int(suite.get('skipped', 0)) == 0, name
              observed[name] = int(suite.get('tests'))
              print(name + ': ' + suite.get('tests') + ' tests passed')
              for case in suite.findall('testcase'):
                  print('  PASS ' + case.get('name'))
          for name, minimum in expected.items():
              assert observed.get(name, 0) >= minimum, 'Missing required runtime tests: ' + name
          print('Android Binder/frame scheduling checks passed; phone performance remains unverified.')
          PY

      - name: Verify compiled catalog, preview and retained wallpaper bytes
        run: |
          set -euo pipefail
          args=()
          if [ "$REBUILD_PAYLOAD" = true ]; then
            args+=(--allow-payload-update)
          fi
          python3 tools/check_sidekick_picker.py work/UnifiedPixelLiveWallpaper.apk \
            --baseline "$BASE_APK" \
            --report work/sidekick-picker-validation.txt "${args[@]}"
          python3 tools/sidekick_dex.py validate work/UnifiedPixelLiveWallpaper.apk \
            --report work/dex-validation.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          apk = Path("work/UnifiedPixelLiveWallpaper.apk")
          if os.environ["REBUILD_PAYLOAD"] == "true":
              with zipfile.ZipFile(apk) as package:
                  for asset in Path("work/assets/sidekick").glob("*.json"):
                      assert package.read("assets/sidekick/" + asset.name) == asset.read_bytes(), asset.name
          stamp = {
              "vendor_source_commit": os.environ["GITHUB_SHA"],
              "device_source_commit": subprocess.check_output(
                  ["git", "-C", "device", "rev-parse", "HEAD"], text=True).strip(),
              "payload_rebuilt": os.environ["REBUILD_PAYLOAD"] == "true",
              "apk_sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              "apk_bytes": apk.stat().st_size,
          }
          Path("work/sidekick-picker-build.json").write_text(
              json.dumps(stamp, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish verified APK to the current branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp work/UnifiedPixelLiveWallpaper.apk "$BASE_APK"
          cp work/sidekick-picker-validation.txt tools/sidekick-picker-validation.txt
          cp work/sidekick-picker-build.json tools/sidekick-picker-build.json
          if [ -f work/render/render-validation.txt ]; then
            cp work/render/render-validation.txt tools/sidekick-render-validation.txt
          fi
          if [ -f work/sidekick-runtime-validation.txt ]; then
            cp work/sidekick-runtime-validation.txt tools/sidekick-runtime-validation.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BASE_APK" tools/sidekick-picker-validation.txt tools/sidekick-picker-build.json
          if [ -f tools/sidekick-render-validation.txt ]; then
            git add tools/sidekick-render-validation.txt
          fi
          if [ -f tools/sidekick-runtime-validation.txt ]; then
            git add tools/sidekick-runtime-validation.txt
          fi
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "coral: publish paced Sidekick playback and typed Motion Sense listeners"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-pixel-live-wallpaper
          path: |
            work/UnifiedPixelLiveWallpaper.apk
            work/sidekick-picker-validation.txt
            work/sidekick-picker-build.json
            work/dex-validation.txt
            work/sidekick-runtime-validation.txt
            work/render/
            work/payload/build/test-results/testDebugUnitTest/
            work/payload/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

