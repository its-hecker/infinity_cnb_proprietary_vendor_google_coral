name: Package experimental Motion Lab
on:
  push:
    branches: [features-experimental]
    paths: ['.github/workflows/air-dj.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: air-dj-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/features-experimental'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: its-hecker/infinity_OsloFeedback
          ref: c13fc950803ece4a796ebbd09bbe83deaa8da480
          path: airdj-source
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned build tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/airdj-tools"
          curl --fail --location --retry 3 https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar -o "$RUNNER_TEMP/airdj-tools/APKEditor.jar"
          curl --fail --location --retry 3 https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.7.18/r8-8.7.18.jar -o "$RUNNER_TEMP/airdj-tools/r8.jar"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test controller and rebuild plugin
        run: |
          APK_EDITOR_JAR="$RUNNER_TEMP/airdj-tools/APKEditor.jar" \
          R8_JAR="$RUNNER_TEMP/airdj-tools/r8.jar" \
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar" \
          bash airdj-source/airdj/build.sh "$RUNNER_TEMP/OsloFeedback-MotionLab.apk"
      - name: Align, sign and verify validation artifact
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/OsloFeedback-MotionLab.apk" "$RUNNER_TEMP/airdj-aligned.apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/airdj-validation.jks" -storepass android -keypass android -alias validation -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Air DJ Validation,O=Hecker,C=PK'
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/airdj-validation.jks" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/OsloFeedback-MotionLab-validation.apk" "$RUNNER_TEMP/airdj-aligned.apk"
          "$BT/apksigner" verify --verbose "$RUNNER_TEMP/OsloFeedback-MotionLab-validation.apk"
          "$BT/zipalign" -c -p 4 "$RUNNER_TEMP/OsloFeedback-MotionLab-validation.apk"
          python3 airdj-source/airdj/tests/check_apk.py "$RUNNER_TEMP/OsloFeedback-MotionLab-validation.apk"
          # Decode the finished DEX and prove the feature classes survived packaging.
          mkdir -p "$RUNNER_TEMP/airdj-verify"
          unzip -p "$RUNNER_TEMP/OsloFeedback-MotionLab-validation.apk" classes2.dex > "$RUNNER_TEMP/airdj-verify/classes2.dex"
          java -cp "$RUNNER_TEMP/airdj-tools/APKEditor.jar" org.jf.baksmali.Main disassemble "$RUNNER_TEMP/airdj-verify/classes2.dex" -o "$RUNNER_TEMP/airdj-verify/smali"
          test -s "$RUNNER_TEMP/airdj-verify/smali/com/google/oslo/AirDjController.smali"
          test -s "$RUNNER_TEMP/airdj-verify/smali/com/google/oslo/AirDjPolicy.smali"
          test -s "$RUNNER_TEMP/airdj-verify/smali/com/google/oslo/OsloExperiments.smali"
          test -s "$RUNNER_TEMP/airdj-verify/smali/com/google/oslo/LabGlowRenderer.smali"
      - name: Store validated plugin on the feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/features-experimental
          APK=proprietary/system_ext/priv-app/OsloFeedback/OsloFeedback.apk
          cp "$RUNNER_TEMP/OsloFeedback-MotionLab-validation.apk" "$APK"
          printf 'Motion Lab + Air DJ source: %s\nAPK SHA256: %s\n' \
            c13fc950803ece4a796ebbd09bbe83deaa8da480 \
            "$(sha256sum "$APK" | cut -d ' ' -f 1)" > tools/air-dj-build.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$APK" tools/air-dj-build.txt
          if ! git diff --cached --quiet; then
            git commit -m 'coral: package validated experimental Motion Lab plugin'
            git push origin HEAD:features-experimental
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: oslo-motion-lab-validation
          path: ${{ runner.temp }}/OsloFeedback-MotionLab-validation.apk
