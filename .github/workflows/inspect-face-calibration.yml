name: Restore stock Face ID calibration dependency

on:
  push:
    branches: [cnb-Latest-stable, features-experimental]
    paths: [".github/workflows/inspect-face-calibration.yml", "tools/check_face_calibration.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout matching device branch
        uses: actions/checkout@v4
        with:
          repository: its-hecker/infinity_cnb_android_device_google_coral
          ref: ${{ github.ref_name }}
          path: device
      - name: Fetch the calibration blob from the matching stock build
        run: |
          set -euo pipefail
          mkdir -p work
          STOCK="https://raw.githubusercontent.com/leddaz-dump-stash/google_coral_dump/18b199b6caa97af88be5b5f99abae6dc1a3a4523"
          curl -fL --retry 3 "$STOCK/vendor/build.prop" -o work/stock-build.prop
          grep -Fx "ro.vendor.build.fingerprint=google/coral/coral:13/TP1A.221005.002.B2/9382335:user/release-keys" work/stock-build.prop
          curl -fL --retry 3 "$STOCK/vendor/lib64/libautocalsolvers.so" -o work/libautocalsolvers.so
          curl -fL --retry 3 "$STOCK/vendor/bin/hw/android.hardware.biometrics.face@1.0-service.google" -o work/stock-face-hal
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          data = Path("work/libautocalsolvers.so").read_bytes()
          digest = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          assert digest == "c2fdf209a1c63f7c8c69bbca85c0b0b7f2fd253c", digest
          print("Calibration Git blob:", digest)
          print("Calibration SHA256:", hashlib.sha256(data).hexdigest())
          PY
      - name: Inspect ELF dependencies and calibration exports
        run: |
          set -euo pipefail
          readelf -Wh work/libautocalsolvers.so > work/calibration-elf.txt
          readelf -Wd work/libautocalsolvers.so >> work/calibration-elf.txt
          readelf -Wn work/libautocalsolvers.so >> work/calibration-elf.txt
          readelf -Ws work/libautocalsolvers.so | c++filt > work/calibration-symbols.txt
          readelf -Wn work/stock-face-hal > work/stock-face-buildid.txt
          readelf -Wn proprietary/vendor/bin/hw/android.hardware.biometrics.face@1.0-service.google > work/current-face-buildid.txt
          readelf -Wd proprietary/vendor/lib64/android.hardware.keymaster@4.1-impl.nos.so > work/keymaster-dependencies.txt
          cat work/calibration-elf.txt work/stock-face-buildid.txt work/current-face-buildid.txt work/keymaster-dependencies.txt
      - name: Verify the solver and active Face HAL package
        run: |
          set -euo pipefail
          python3 tools/check_face_calibration.py work/libautocalsolvers.so \
            --stock-face work/stock-face-hal \
            --face proprietary/vendor/bin/hw/android.hardware.biometrics.face@1.0-service.google \
            --device-root device \
            --report work/face-calibration-validation.txt
      - name: Publish the verified calibration dependency
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp work/libautocalsolvers.so proprietary/vendor/lib64/libautocalsolvers.so
          cp work/face-calibration-validation.txt tools/face-calibration-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proprietary/vendor/lib64/libautocalsolvers.so tools/face-calibration-validation.txt
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "face: ship the missing stock automatic calibration solver"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Upload inspected calibration blob
        uses: actions/upload-artifact@v4
        with:
          name: stock-face-calibration
          path: work/
